<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Call | Juan Hurtado</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="stylesheet" href="../assets/responsive.css">
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .call-page {
            padding: 100px 0 60px;
            min-height: 100vh;
        }

        .call-intro {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .call-intro p {
            color: var(--text-secondary);
            margin-top: 12px;
        }

        #cal-booking {
            width: 100%;
            min-height: 700px;
            border-radius: 14px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>

    <!-- Navigation (Minimal) -->
    <nav class="navbar">
        <a href="../index.html" class="logo">Juan.</a>
    </nav>

    <main class="section call-page">
        <div class="container">
            <div class="call-intro">
                <h1 class="section-title">Book a Call</h1>
                <p>Pick a time that works for you and I'll send a confirmation with the meeting link.</p>
            </div>
            <div id="cal-booking"></div>
        </div>
    </main>

    <!-- Cal.com inline embed -->

                    cal.loaded = true;

            elementOrSelector: "#cal-booking",
            calLink: "testing-apps-fn1dv2",
            config: { layout: "month_view" }
        });

        Cal("ui", { hideEventTypeDetails: false, layout: "month_view" });

</body>

</html>
